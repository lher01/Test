<!doctype html>
<html lang="de">
	<head>
		<link rel="stylesheet" href="../email/style.css" />
	</head>
	<body>
		<form id="kontaktformular">
			<label for="name">Name</label>
			<input id="name" name="name" type="text" required />
			<label for="email">E-Mail-Adresse</label>
			<input id="email" name="email" type="email" required />
			<label for="nachricht">Nachricht</label>
			<textarea
				id="nachricht"
				name="nachricht"
				required
				maxlength="500"
			></textarea>
			<p id="zeichenzaehler">0 / 500 Zeichen</p>
			<button type="submit">Anfrage prüfen</button>
			<p id="rueckmeldung" role="status"></p>
		</form>
	</body>
	<script src="kontakt.js" defer></script>
</html>
